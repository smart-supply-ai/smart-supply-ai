server {
  listen 80;

  # Docker's internal DNS — required for variable-based proxy_pass
  resolver 127.0.0.11 valid=10s;

  # ── Static Frontend ───────────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # ── API Gateway: Data Service ─────────────────────────────────────────────
  # /api/data/sample  →  http://data-service:8000/data/sample
  location /api/data/ {
    set $upstream_data http://data-service:8000;
    rewrite ^/api/data/(.*)$ /data/$1 break;
    proxy_pass         $upstream_data;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ── API Gateway: ML Service ───────────────────────────────────────────────
  # /api/ml/predict  →  http://ml-service:8000/predict
  location /api/ml/ {
    set $upstream_ml http://ml-service:8000;
    rewrite ^/api/ml/(.*)$ /$1 break;
    proxy_pass         $upstream_ml;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ── API Gateway: Alert Service ────────────────────────────────────────────
  # /api/alerts/run  →  http://alert-service:8000/alerts/run
  location /api/alerts/ {
    set $upstream_alerts http://alert-service:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         $upstream_alerts;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
