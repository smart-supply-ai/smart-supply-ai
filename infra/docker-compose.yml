services:
  db:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-smart-supply-postgres}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init scripts (only on first init / empty volume)
      - ../db/init:/docker-entrypoint-initdb.d:ro
      - ../data:/tmp/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-supply-net]

  data-service:
    build:
      context: ../services/data-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks: [smart-supply-net]

  ml-service:
    build:
      context: ../services/ml-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATA_SERVICE_URL: http://data-service:8000
    depends_on:
      data-service:
        condition: service_started
    ports:
      - "8002:8000"
    volumes:
      - ml_models:/app/models
    networks: [smart-supply-net]

  alert-service:
    build:
      context: ../services/alert-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_SERVICE_URL: http://data-service:8000
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "8003:8000"
    networks: [smart-supply-net]

  query-service:
    build:
      context: ../services/query-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8004:8000"
    networks: [smart-supply-net]

volumes:
  pgdata:
  ml_models:

networks:
  smart-supply-net:
    name: smart-supply-net
